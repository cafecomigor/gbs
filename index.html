<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GBS</title>
<style>
  :root {
    --bg: #0a0e14;
    --bg-alt: #111722;
    --line: #1e2733;
    --text: #e7ecf3;
    --text-dim: #8b97a8;
    --accent: #3ddc97;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .mark {
    font-size: clamp(3rem, 12vw, 6rem);
    font-weight: 700;
    letter-spacing: 0.08em;
    margin: 0;
    background: linear-gradient(135deg, var(--text) 0%, var(--accent) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .tag {
    color: var(--text-dim);
    font-size: 1rem;
    letter-spacing: 0.04em;
    margin-top: 12px;
  }
  .status {
    margin-top: 40px;
    padding: 10px 20px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--bg-alt);
    color: var(--text-dim);
    font-size: 0.85rem;
  }
  .status strong {
    color: var(--accent);
    font-weight: 600;
  }
</style>
</head>
<body>
  <h1 class="mark">GBS</h1>
  <p class="tag">identidade visual e site em desenvolvimento</p>
  <div class="status"><strong>Em construção</strong> — aguardando materiais de marca</div>
</body>
</html>
